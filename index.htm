<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vape Studio 2.0 POS</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#100d18;color:white;font-family:Arial}
header{background:#21152f;padding:22px;font-size:24px;color:#d9a4ff;font-weight:bold}
main{padding:25px}
h2{color:#d9a4ff}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px}
.card{background:#241a31;padding:22px;border-radius:12px}
.card p{color:#c6b5d3}
.card strong{font-size:25px}
button{background:#923bcb;color:white;border:0;padding:12px 20px;border-radius:7px}
</style>
</head>
<body>
<header>VAPE STUDIO 2.0 | POS</header>
<main>
<h2>Business Dashboard</h2>
<div class="cards">
<div class="card"><p>Today's Sales</p><strong>Rs. 0</strong></div>
<div class="card"><p>Total Products</p><strong>0</strong></div>
<div class="card"><p>Low Stock</p><strong>0</strong></div>
<div class="card"><p>Total Expenses</p><strong>Rs. 0</strong></div>
</div>
<h2>Welcome to Vape Studio 2.0</h2>
<p>Your business management system starts here.</p>
<button onclick="alert('Dashboard is working!')">Test Dashboard</button>
</main>
</body>
</html>
